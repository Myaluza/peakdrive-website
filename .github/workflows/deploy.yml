name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two pushes close together must not upload over each other.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A commit that fails any of these must not reach the live site.
      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          VITE_GA4_MEASUREMENT_ID: ${{ vars.VITE_GA4_MEASUREMENT_ID }}
        run: npm run build

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # The FTP account's home folder is public_html. Files are only added or
      # replaced, never deleted, so a wrong folder can't remove anything.
      - name: Upload
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            set net:max-retries 3;
            open --env-password -u \"$FTP_USERNAME\" epyc.cybercircuit.co.za;
            mirror --reverse --overwrite --parallel=4 --exclude-glob .vite/ dist .;
          "
