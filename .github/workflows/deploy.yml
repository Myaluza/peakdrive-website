name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two pushes close together must not upload over each other.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A stuck step must fail, not hold the deploy for hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A commit that fails any of these must not reach the live site.
      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          VITE_GA4_MEASUREMENT_ID: ${{ vars.VITE_GA4_MEASUREMENT_ID }}
        run: npm run build

      # Uses cPanel's upload API over HTTPS, because the plan has no SSH and FTP
      # logins are refused. Files are only added or replaced, never deleted.
      # Pages go last, so a page never goes up before the files it loads.
      - name: Upload
        working-directory: dist
        env:
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
        run: |
          rm -rf .vite
          while IFS= read -r file; do
            file="${file#./}"
            folder="$(dirname "$file")"
            target="public_html"
            if [ "$folder" != "." ]; then target="public_html/$folder"; fi
            response="$(curl -sS --max-time 60 --retry 2 \
              -H "Authorization: cpanel $CPANEL_USERNAME:$CPANEL_TOKEN" \
              -F "file-1=@$file" \
              "https://phandadrive.co.za:2083/execute/Fileman/upload_files?dir=$target&overwrite=1&permissions=0644")"
            if ! jq -e '.status == 1 and .data.failed == 0' <<< "$response" > /dev/null; then
              echo "::error::Upload failed for $file"
              jq -c '.errors // .' <<< "$response" || echo "$response" | head -c 300
              exit 1
            fi
            echo "uploaded $file"
          done < <(find . -type f ! -name '*.html'; find . -type f -name '*.html')
